- date: Jan 24, 2026
  title: Our extended survey on multi-behavior recommender systems has been published
    in the International Journal of Data Science and Analytics
  content: "Our work, “A Comprehensive Survey on Multi-Behavior Recommender Systems:\
    \ Extended Taxonomy and Recent Advances,” has been published in the International\
    \ Journal of Data Science and Analytics. \nThis work substantially extends our\
    \ PAKDD 2025 Best Survey Paper by presenting a broader and more systematic taxonomy\
    \ of multi-behavior recommender systems across three key stages: data modeling,\
    \ encoding, and training. The extended survey covers graph-, sequence-, and text-based\
    \ approaches, incorporates recent advances including LLM-based methods, and provides\
    \ expanded discussions on benchmark datasets, evaluation protocols, real-world\
    \ applications, scalability, and multimodal integration. Through this comprehensive\
    \ perspective, the survey aims to provide a unified understanding of the rapidly\
    \ evolving landscape of multi-behavior recommendation and identify promising directions\
    \ for future research."
