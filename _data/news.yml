- date: May 4, 2026
  title: Our Paper on Personalized Graph Ranking for Multi-Behavior Recommendation
    Accepted for Publication in ACM TIST
  content: 'Our paper, “Personalized Ranking on Cascading Behavior Graphs for Accurate
    Multi-Behavior Recommendation,” has been accepted for publication in ACM Transactions
    on Intelligent Systems and Technology (TIST), a leading journal in intelligent
    systems and related technologies. ACM reports a 2025 Impact Factor of 10.7, with
    TIST ranked in Q1 in both Computer Science, Information Systems and Computer Science,
    Artificial Intelligence.


    This work was led by our lab members Geonwoo Ko and Minseo Jeon, who contributed
    equally as co-first authors.


    In this paper, we propose CascadingRank, a personalized graph-ranking method for
    multi-behavior recommendation. CascadingRank models the progression of user behaviors—from
    viewing and adding an item to a cart to purchasing—through a cascading behavior
    graph. It directly computes personalized rankings and purchase probabilities by
    transferring preference signals across successive behaviors. Experiments on three
    real-world datasets demonstrate improvements of up to 9.56% in HR@10 and 7.16%
    in NDCG@10 over existing methods. Theoretical analyses further establish the convergence
    and scalability of the proposed algorithm.


    Our key takeaway is that GNN-based approaches may weaken the sequential relationships
    among cascading behaviors, such as view → cart → purchase, because repeated message
    passing can blur behavior-specific preference signals through over-smoothing.
    In contrast, graph ranking can preserve this progression by computing personalized
    rankings for each user and directly estimating how preferences transfer across
    behaviors toward the final purchase.'
