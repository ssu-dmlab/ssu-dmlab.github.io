- date: Jan 13, 2026
  title: Our Paper on Recommendtion Free from Users, IDs, and GNNs Accepted at WWW
    2026
  content: 'Our paper, “AlphaFree: Recommendation Free from Users, IDs, and GNNs,”
    has been accepted at The ACM Web Conference 2026 (WWW 2026), a premier international
    conference in Web research, data mining, and information retrieval.


    This work was conducted by our lab members Minseo Jeon, Junwoo Jung, and Daewon
    Gwak.


    In this paper, we propose AlphaFree, a top-K recommendation framework that does
    not rely on stored user embeddings, raw item IDs, or GNNs. AlphaFree constructs
    user preferences directly from interaction histories, represents items through
    pretrained language models, and captures collaborative filtering signals using
    behaviorally and semantically related items. Across seven real-world datasets,
    AlphaFree improves recommendation accuracy by up to approximately 43% over methods
    without language representations and 5.7% over language-representation-based methods,
    while reducing GPU memory usage by up to 69%.


    Our key takeaway is that conventional components such as user embeddings, item
    IDs, and GNNs are not mandatory for effective recommendation. In particular, collaborative
    signals can be captured without GNN propagation, while eliminating persistent
    user embeddings and item IDs can improve generalization and scalability—especially
    in domains where new users and cold items arrive frequently.'
