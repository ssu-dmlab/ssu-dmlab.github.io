- date: Aug 28, 2025
  title: Our work on SSL for signed graphs has been accepted at ICDM 2025
  content: "Our work, “PIGLET: Probabilistic Message Passing for Semi-supervised Link\
    \ Sign Prediction,” has been accepted at IEEE International Conference on Data\
    \ Mining (ICDM) 2025. \nIn this work, we propose PIGLET, a semi-supervised learning\
    \ framework for signed graphs where only a limited fraction of positive and negative\
    \ link labels are available. PIGLET probabilistically assigns soft labels to unlabeled\
    \ links and incorporates them into message passing while controlling unreliable\
    \ information through confidence-based weighting and relation-aware attention.\
    \ The method further establishes a theoretical connection between its iterative\
    \ refinement procedure and the Expectation-Maximization (EM) framework. Experiments\
    \ on five real-world signed graphs demonstrate that PIGLET consistently outperforms\
    \ existing signed GNN methods under limited supervision, achieving improvements\
    \ of up to 7.6% in AUC and 11.0% in Macro-F1. This work is a joint research collaboration\
    \ with Seoul National University. "
