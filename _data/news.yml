- date: Jun 5, 2026
  title: Junwoo and Daewon have been selected as recipients of the 2026 AI Seoul Tech
    Research Scholarship
  content: <b>Junwoo and Daewon have been selected as scholarship recipients of the
    2026 AI Seoul Tech Research Support Program (Master’s Program) organized by the
    Seoul Future Foundation.</b> The program supports outstanding graduate researchers
    in AI-related science and engineering fields at universities in Seoul, providing
    KRW 20 million per year to each selected master’s student to support their research
    activities. We congratulate Junwoo and Daewon on their achievement and look forward
    to their continued growth and contributions to AI research.
