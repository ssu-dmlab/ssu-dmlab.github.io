- date: Jan 24, 2026
  title: Our extended survey on multi-behavior recommender systems has been published
    in the International Journal of Data Science and Analytics
  content: "Our work, “A Comprehensive Survey on Multi-Behavior Recommender Systems:\
    \ Extended Taxonomy and Recent Advances,” has been published in the International\
    \ Journal of Data Science and Analytics. \nThis work substantially extends our\
    \ PAKDD 2025 Best Survey Paper by presenting a broader and more systematic taxonomy\
    \ of multi-behavior recommender systems across three key stages: data modeling,\
    \ encoding, and training. The extended survey covers graph-, sequence-, and text-based\
    \ approaches, incorporates recent advances including LLM-based methods, and provides\
    \ expanded discussions on benchmark datasets, evaluation protocols, real-world\
    \ applications, scalability, and multimodal integration. Through this comprehensive\
    \ perspective, the survey aims to provide a unified understanding of the rapidly\
    \ evolving landscape of multi-behavior recommendation and identify promising directions\
    \ for future research."
  keyword: ''
  link: /publications
  image: /assets/images/news/2026-01-24-57eb3b846a2a.png
- date: Jan 13, 2026
  title: Our work on recommendation free from users, IDs, and GNNs has been accepted
    at WWW 2026
  content: "Our work, “AlphaFree: Recommendation Free from Users, IDs, and GNNs,”\
    \ has been accepted at The ACM Web Conference 2026 (WWW 2026), one of the premier\
    \ international conferences in Web and data mining research. \nIn this work, we\
    \ propose AlphaFree, a new recommendation framework that challenges three common\
    \ design conventions in recommender systems: storing user embeddings, relying\
    \ on discrete item IDs, and using graph neural networks (GNNs). AlphaFree instead\
    \ models user preferences on-the-fly, represents items using language representations\
    \ from pretrained language models, and captures collaborative signals through\
    \ similarity-based augmentation and contrastive learning without GNNs. Experiments\
    \ on seven real-world datasets show that AlphaFree consistently outperforms existing\
    \ methods, achieving up to 5.7% improvement over language-representation-based\
    \ methods and over 40% improvement over conventional methods, while reducing GPU\
    \ memory usage by up to 69%."
  keyword: ''
  link: /publications
