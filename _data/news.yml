- date: Jan 13, 2026
  content: "Our work, “AlphaFree: Recommendation Free from Users, IDs, and GNNs,”\
    \ has been accepted at The ACM Web Conference 2026 (WWW 2026), one of the premier\
    \ international conferences in Web and data mining research. \n\nIn this work,\
    \ we propose AlphaFree, a new recommendation framework that challenges three common\
    \ design conventions in recommender systems: storing user embeddings, relying\
    \ on discrete item IDs, and using graph neural networks (GNNs). AlphaFree instead\
    \ models user preferences on-the-fly, represents items using language representations\
    \ from pretrained language models, and captures collaborative signals through\
    \ similarity-based augmentation and contrastive learning without GNNs. Experiments\
    \ on seven real-world datasets show that AlphaFree consistently outperforms existing\
    \ methods, achieving up to 5.7% improvement over language-representation-based\
    \ methods and over 40% improvement over conventional methods, while reducing GPU\
    \ memory usage by up to 69%."
