- date: May 4, 2026
  title: Our work on CascadingRank for multi-behavior recommendation has been accepted
    at ACM Transactions on Intelligent Systems and Technology.
  content: "Our work, “Personalized Ranking on Cascading Behavior Graphs for Accurate\
    \ Multi-Behavior Recommendation,” has been accepted for publication in ACM Transactions\
    \ on Intelligent Systems and Technology (TIST). \nIn this work, we propose CascadingRank,\
    \ a personalized graph-ranking method that captures the natural progression of\
    \ user behaviors (e.g., view → cart → purchase) through a cascading behavior graph.\
    \ Experiments on three real-world datasets demonstrate that CascadingRank outperforms\
    \ state-of-the-art methods, achieving improvements of up to 9.56% in HR@10 and\
    \ 7.16% in NDCG@10, while theoretical analyses establish its convergence and scalability.\
    \ ACM TIST is a leading journal in intelligent systems and AI published by ACM;\
    \ ACM currently reports a 2025 Impact Factor of 10.7, with Q1 rankings in both\
    \ Computer Science, Information Systems and Computer Science, Artificial Intelligence."
  keyword: ''
